<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff3100" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <polygon points="100,40 115,75 155,75 122,98 135,135 100,112 65,135 78,98 45,75 85,75" fill="none" stroke="#ff3100" stroke-width="2" opacity="0.6"/>
  <circle cx="100" cy="88" r="20" fill="#ff3100" opacity="0.2"/>
  <text x="100" y="96" text-anchor="middle" font-size="24" fill="#ff3100" font-family="serif" filter="url(#glow)">破</text>
  <text x="100" y="165" text-anchor="middle" font-size="14" fill="#ff3100" font-family="sans-serif" font-weight="bold" opacity="0.8">Phá Thiên</text>
</svg>