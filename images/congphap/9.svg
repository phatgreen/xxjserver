    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <path d="M100 50 C100 50 130 70 130 95 C130 115 115 130 100 130 C85 130 70 115 70 95 C70 70 100 50 100 50" fill="none" stroke="#ff3100" stroke-width="2" opacity="0.5"/>
  <circle cx="100" cy="90" r="15" fill="#ff3100" opacity="0.2"/>
  <text x="100" y="98" text-anchor="middle" font-size="20" fill="#ff3100" font-family="serif" filter="url(#glow)">血</text>
  <text x="100" y="165" text-anchor="middle" font-size="14" fill="#ff3100" font-family="sans-serif" font-weight="bold" opacity="0.8">Mệnh Huyết</text>
