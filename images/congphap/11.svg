    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <path d="M70 120 Q85 60 100 90 Q115 60 130 120" fill="none" stroke="#10bf61" stroke-width="2" opacity="0.5"/>
  <circle cx="100" cy="85" r="20" fill="none" stroke="#10bf61" stroke-width="1.5" opacity="0.4"/>
  <circle cx="100" cy="85" r="6" fill="#10bf61" opacity="0.5" filter="url(#glow)"/>
  <text x="100" y="93" text-anchor="middle" font-size="16" fill="#fff" font-family="serif" filter="url(#glow)">神</text>
  <text x="100" y="165" text-anchor="middle" font-size="14" fill="#10bf61" font-family="sans-serif" font-weight="bold" opacity="0.8">Thần Hành</text>
</svg>