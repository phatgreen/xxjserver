<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f9c508" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <polygon points="100,50 120,80 140,80 125,100 130,130 100,115 70,130 75,100 60,80 80,80" fill="none" stroke="#f9c508" stroke-width="2" opacity="0.5"/>
  <circle cx="100" cy="90" r="15" fill="#f9c508" opacity="0.2"/>
  <text x="100" y="98" text-anchor="middle" font-size="24" fill="#f9c508" font-family="serif" filter="url(#glow)">寶</text>
  <text x="100" y="165" text-anchor="middle" font-size="14" fill="#f9c508" font-family="sans-serif" font-weight="bold" opacity="0.8">Tụ Bảo</text>
</svg>