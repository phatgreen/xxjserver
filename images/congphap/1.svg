<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f9c508" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <circle cx="100" cy="90" r="45" fill="none" stroke="#f9c508" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <circle cx="100" cy="90" r="30" fill="none" stroke="#f9c508" stroke-width="1.5" opacity="0.4"/>
  <circle cx="100" cy="90" r="15" fill="#f9c508" opacity="0.3"/>
  <text x="100" y="98" text-anchor="middle" font-size="28" fill="#f9c508" font-family="serif" filter="url(#glow)">混</text>
  <text x="100" y="165" text-anchor="middle" font-size="14" fill="#f9c508" font-family="sans-serif" font-weight="bold" opacity="0.8">Hỗn Nguyên</text>
</svg>