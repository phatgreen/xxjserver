<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f9c508" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <polygon points="100,45 140,70 140,110 100,135 60,110 60,70" fill="none" stroke="#f9c508" stroke-width="2" opacity="0.5"/>
  <polygon points="100,55 130,75 130,105 100,125 70,105 70,75" fill="none" stroke="#f9c508" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="88" r="12" fill="#f9c508" opacity="0.3" filter="url(#glow)"/>
  <text x="100" y="96" text-anchor="middle" font-size="18" fill="#fff" font-family="serif" filter="url(#glow)">不</text>
  <text x="100" y="165" text-anchor="middle" font-size="14" fill="#f9c508" font-family="sans-serif" font-weight="bold" opacity="0.8">Bất Động</text>
</svg>