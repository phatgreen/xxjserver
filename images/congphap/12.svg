<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f9c508" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <rect x="70" y="55" width="60" height="75" rx="5" fill="none" stroke="#f9c508" stroke-width="2" opacity="0.5"/>
  <line x1="80" y1="70" x2="120" y2="70" stroke="#f9c508" stroke-width="1" opacity="0.3"/>
  <line x1="80" y1="85" x2="120" y2="85" stroke="#f9c508" stroke-width="1" opacity="0.3"/>
  <line x1="80" y1="100" x2="120" y2="100" stroke="#f9c508" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="90" r="15" fill="#f9c508" opacity="0.2"/>
  <text x="100" y="98" text-anchor="middle" font-size="22" fill="#f9c508" font-family="serif" filter="url(#glow)">道</text>
  <text x="100" y="165" text-anchor="middle" font-size="14" fill="#f9c508" font-family="sans-serif" font-weight="bold" opacity="0.8">Đại Đạo</text>
</svg>