<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#10bf61" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg)"/>
  <path d="M100 50 Q120 70 100 90 Q80 70 100 50" fill="#10bf61" opacity="0.3"/>
  <path d="M100 70 Q130 100 100 130 Q70 100 100 70" fill="none" stroke="#10bf61" stroke-width="2" opacity="0.5"/>
  <circle cx="100" cy="90" r="8" fill="#10bf61" opacity="0.5" filter="url(#glow)"/>
  <text x="100" y="98" text-anchor="middle" font-size="18" fill="#fff" font-family="serif" filter="url(#glow)">春</text>
  <text x="100" y="165" text-anchor="middle" font-size="14" fill="#10bf61" font-family="sans-serif" font-weight="bold" opacity="0.8">Hồi Xuân</text>
</svg>